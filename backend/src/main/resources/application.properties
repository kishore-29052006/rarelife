# =====================================================================
# RareLife: Spring Boot Application Configuration
# Server, Database, Hibernate & Security Settings
# =====================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/rarelife_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Limit for Laboratory Test Reports (PDF / PNG)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.rarelife=DEBUG
logging.level.org.springframework.web=INFO
